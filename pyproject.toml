# Seriatim uv workspace (ADR-001 §10 S0a). The packages live in node/ (and, from S7, gateway/).
[project]
name = "seriatim-workspace"
version = "0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["node"]

[tool.uv.sources]
seriatim-node = { workspace = true }

[dependency-groups]
dev = [
    "seriatim-node",
    "pytest",
    "pytest-cov",
    "hypothesis",
    "openapi-spec-validator",
    "jsonschema",
    "pyyaml",
    "mutmut>=3.3,<4",
    "ruff",
    # Security scanners (SPEC REQ-63): exact versions, hash-verified through uv.lock.
    "bandit==1.9.4",
    "pip-audit==2.10.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["seriatim_node"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
markers = [
    "process: runs the sidecar as a subprocess (not mutation-tested: it runs installed code)",
    "behaviour: black-box PPE suite (tests/behaviour), run only by the ppe job",
    "td(*ids): the TD test-scenario IDs this test discharges (SPEC REQ-60; tools/ci/td_test_ids.py)",
]
# An unexpectedly passing xfail is a failure, so it can never count as discharging an ID.
xfail_strict = true

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
