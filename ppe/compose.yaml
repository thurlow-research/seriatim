# The PPE: one Ollama node with real CPU-only micro-models and the sidecar in front of it
# (SPEC §8.3; TD-slice-1 §6, §8.6 and App. B, S0b).
# Start it only through `ppe/ppe up`, which checks this file's effective configuration first,
# after staging node-a's code with `python3 -I tools/ppe_stage_node.py`.
#
# Images are pinned by digest (multi-arch index); Dependabot's docker-compose ecosystem proposes
# digest bumps (.github/dependabot.yml, SPEC §7.9).
#   ollama/ollama:0.40.16  https://hub.docker.com/r/ollama/ollama
#   nicolaka/netshoot:v0.16 https://github.com/nicolaka/netshoot (ships tcpdump and socat)
#   python:3.12.16-slim-trixie https://hub.docker.com/_/python (runs the sidecar, node-a)
#
# Ports on the host, all on 127.0.0.1: 11434 is plain Ollama (the debug helper, dbg-a), 11436
# is the sidecar (through its forwarder, fwd-a). Inside ollama-a's namespace Ollama itself is
# on 127.0.0.1:11435 and the sidecar (node-a) on 127.0.0.1:11437: the sidecar listens on
# loopback only, test mode included (TD-slice-2 §6, S2-R2).
#
# Limits: ollama-a 3 CPUs / 5 GiB, cap-a 0.25 / 256 MiB, dbg-a 0.15 / 128 MiB,
# fwd-a 0.1 / 64 MiB, node-a 0.5 / 384 MiB. Sum: 4 CPUs, 5,952 MiB (the guard refuses more
# than 4 CPUs or 6 GiB).
name: seriatim-ppe

services:
  ollama-a:
    image: ollama/ollama:0.40.17@sha256:ccc42bcd3d5fcf7ab0d532b300382154e1a4da56fc666bdb313b78ebdd912754
    environment:
      # Bound to loopback inside its own network namespace, as in production.
      OLLAMA_HOST: "127.0.0.1:11435"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "2048"
    volumes:
      # Models live under ppe/, so CI can cache them between runs (gitignored).
      - type: bind
        source: ./data/ollama
        target: /root/.ollama
    # The forwarders (dbg-a, fwd-a) share this namespace, so their ports are published here,
    # on the host's loopback only: 11434 for direct comparison with plain Ollama, 11436 for
    # the sidecar.
    ports:
      - "127.0.0.1:11434:11434"
      - "127.0.0.1:11436:11436"
    deploy:
      resources:
        limits:
          cpus: "3"
          memory: 5G

  # Packet capture of the raw bytes Ollama receives.
  cap-a:
    image: nicolaka/netshoot:v0.17@sha256:7c6d613e96cbd29bc74f2d1d35035eeb2ec5e7b1cfbbc3277bd697bc3db7b40a
    network_mode: "service:ollama-a"
    cap_drop: [ALL]
    cap_add: [NET_RAW, NET_ADMIN]
    command: ["tcpdump", "-i", "lo", "-U", "-w", "/capture/ollama-a.pcap", "tcp dst port 11435"]
    volumes:
      - type: bind
        source: ./data/capture
        target: /capture
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  # Loopback debug port: forwards 0.0.0.0:11434 in ollama-a's namespace to Ollama on
  # 127.0.0.1:11435. Published only on the host's 127.0.0.1 (see ollama-a's ports).
  dbg-a:
    image: nicolaka/netshoot:v0.17@sha256:7c6d613e96cbd29bc74f2d1d35035eeb2ec5e7b1cfbbc3277bd697bc3db7b40a
    network_mode: "service:ollama-a"
    cap_drop: [ALL]
    command: ["socat", "TCP-LISTEN:11434,fork,reuseaddr", "TCP:127.0.0.1:11435"]
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: 128M

  # The sidecar's forwarder (TD-slice-2 §6, S2-R8), built like dbg-a: forwards 0.0.0.0:11436
  # in ollama-a's namespace to the sidecar on 127.0.0.1:11437. Published only on the host's
  # 127.0.0.1 (see ollama-a's ports). The sidecar sees every PPE client as 127.0.0.1.
  fwd-a:
    image: nicolaka/netshoot:v0.17@sha256:7c6d613e96cbd29bc74f2d1d35035eeb2ec5e7b1cfbbc3277bd697bc3db7b40a
    network_mode: "service:ollama-a"
    cap_drop: [ALL]
    command: ["socat", "TCP-LISTEN:11436,fork,reuseaddr", "TCP:127.0.0.1:11437"]
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64M

  # The sidecar (TD-slice-1 §6, S1-14), in ollama-a's network namespace, as on a node: it
  # forwards to Ollama on 127.0.0.1:11435. It runs from ppe/data/node, mounted read-only,
  # which `python3 -I tools/ppe_stage_node.py` fills before `ppe/ppe up`, in CI and locally
  # (the package and its hash-pinned dependencies from uv.lock). No image is built, so the
  # guard's allowlist needs no `build` key. drain_s is 10, so P7's NODE_STARTING window is
  # wide. It runs as root with every capability dropped: `user`, `read_only` and
  # `security_opt` are not on the guard's allowlist.
  node-a:
    image: python:3.12.16-slim-trixie@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
    network_mode: "service:ollama-a"
    cap_drop: [ALL]
    command: ["python", "-m", "seriatim_node"]
    environment:
      PYTHONPATH: /opt/seriatim
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      # Loopback inside the namespace, reached through fwd-a (TD-slice-2 §6, S2-R2). Test mode,
      # with no keys: unauthenticated until S4a (TD-slice-2 Q16).
      SERIATIM_NODE_LISTEN_HOST: 127.0.0.1
      SERIATIM_NODE_LISTEN_PORT: "11437"
      SERIATIM_NODE_ALLOW_UNAUTHENTICATED: "true"
      SERIATIM_NODE_OLLAMA_URL: http://127.0.0.1:11435
      SERIATIM_NODE_ID: node-a
      SERIATIM_NODE_DRAIN_S: "10"
      # P4 holds a gated request in its body read while a model downloads; the default 30 s
      # would make a slow registry look like a sidecar failure.
      SERIATIM_NODE_BODY_TIMEOUT_S: "300"
      SERIATIM_NODE_LOCK_DIR: /run/seriatim
    volumes:
      - type: bind
        source: ./data/node
        target: /opt/seriatim
        read_only: true
      - type: tmpfs
        target: /run/seriatim
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
