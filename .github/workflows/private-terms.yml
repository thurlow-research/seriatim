# Private-terms check (SPEC REQ-51, REQ-63). Required on main as `private-terms`.
#
# pull_request_target runs this file, and the scanner it checks out, from main (GITHUB_SHA),
# never from the pull request, so fork pull requests get the same check with main's code and
# the term list. The pull request is read only as git objects, fetched by validated SHA into
# a fresh bare repository by tools/ci/private_terms.py; it is never checked out.
#
# Publicly it reports one fixed line. The match locations go to the maintainer only, in an
# artifact padded to 64 KiB and encrypted with age, uploaded on every run. No cache is used.
# Event values reach steps only through env:, never inside run:.
name: private-terms

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  private-terms:
    name: private-terms
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AGE_VERSION: "1.3.2"
      AGE_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
    steps:
      - name: Check out the scanner from main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install age (pinned, checksum-verified)
        run: |
          set -euo pipefail
          tarball="age-v${AGE_VERSION}-linux-amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/${tarball}"
          echo "${AGE_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict --quiet
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" age/age

      - name: Scan
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
          PRIVATE_TERMS_AGE_RECIPIENT: ${{ vars.PRIVATE_TERMS_AGE_RECIPIENT }}
          AGE_BIN: ${{ runner.temp }}/age/age
          REPORT_PATH: ${{ runner.temp }}/private-terms-report.age
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
        run: python3 -I tools/ci/private_terms.py

      - name: Upload the encrypted report (every run, fixed name)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: private-terms-report
          path: ${{ runner.temp }}/private-terms-report.age
          if-no-files-found: error
          retention-days: 30
