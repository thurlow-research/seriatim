# CI (SPEC REQ-60, REQ-61, REQ-63, §8.3; ADR-001 §10 S0a, S0b). Runs on every pull request and on every
# push to main. The job `ci` rolls up every other job, so the main ruleset needs only `ci`.
# Event values reach steps only through if: and env:, never inside run:.
name: ci

on:
  pull_request:
    # edited: td-test-ids reads waiver lines from the PR body, so a body edit re-runs CI.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

env:
  UV_VERSION: "0.11.19"
  UV_PYTHON: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run --frozen pytest -m "not behaviour" --junitxml="$RUNNER_TEMP/junit.xml"
      # td-test-ids reads this leg's results (SPEC REQ-63): an ID counts only if its test ran
      # and passed here.
      - name: Upload the JUnit report for td-test-ids
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: junit-test-ubuntu
          path: ${{ runner.temp }}/junit.xml
          if-no-files-found: error
          retention-days: 7

  # The PPE (SPEC §8.3; #9): CPU-only micro-models in Docker Compose, started through the guard.
  # S0b checks that Ollama answers and the models are real; S1 adds P1-P7 to tests/behaviour.
  ppe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv sync --frozen
      # The models (about 1.5 GB) are cached between runs (SPEC §8.3). The key names the Ollama
      # version and the models. A pull request's run writes only its own PR-scoped cache, so it
      # never reaches the runs on main.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ppe/data/ollama
          key: ppe-models-ollama-0.40.16-qwen2.5-0.5b-1.5b-all-minilm-22m-v1
      - name: Start the PPE through the guard
        run: ppe/ppe up --ci
      - name: S0b checks (tests/behaviour)
        env:
          SERIATIM_PPE_URL: http://127.0.0.1:11434
        run: >-
          uv run --frozen pytest -m behaviour tests/behaviour -rA
          --junitxml="$RUNNER_TEMP/junit-ppe.xml"
      - name: What ran
        if: always()
        run: |
          docker compose -p seriatim-ppe -f ppe/compose.yaml ps
          docker compose -p seriatim-ppe -f ppe/compose.yaml logs --no-color --tail 50 ollama-a
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: junit-ppe
          path: ${{ runner.temp }}/junit-ppe.xml
          if-no-files-found: error
          retention-days: 7
      - name: Stop the PPE
        if: always()
        run: ppe/ppe down

  # Reads both reports from this run (#9): fails closed if test or ppe did not succeed, or
  # either report is missing, empty or malformed, even while every TD says 'Enforced: no'.
  td-test-ids:
    if: always()
    needs: [test, ppe]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: test and ppe succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 -I tools/ci/td_test_ids.py --check-needs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: junit-test-ubuntu
          path: ${{ runner.temp }}/junit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: junit-ppe
          path: ${{ runner.temp }}/junit-ppe
      - name: Every TD test ID is discharged by a passing test
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          NEEDS: ${{ toJSON(needs) }}
        run: >-
          python3 -I tools/ci/td_test_ids.py
          --junit "$RUNNER_TEMP/junit/junit.xml"
          --junit "$RUNNER_TEMP/junit-ppe/junit-ppe.xml"

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv sync --frozen
      # One block per package; the gateway (S7) adds its own.
      - name: node, combined coverage >= 80 %
        run: >-
          uv run --frozen pytest -m "not behaviour"
          --cov=seriatim_node --cov-branch --cov-report=term-missing --cov-fail-under=80
      - name: node, branch coverage >= 80 %
        run: |
          set -euo pipefail
          uv run --frozen coverage json -q -o "$RUNNER_TEMP/coverage-node.json"
          python3 -I - "$RUNNER_TEMP/coverage-node.json" <<'PY'
          import json, sys
          totals = json.load(open(sys.argv[1]))["totals"]
          if totals["num_branches"] == 0:
              sys.exit("::error::no branches measured")
          pct = totals["percent_branches_covered"]
          print(f"node: branch coverage {pct:.2f} % "
                f"({totals['covered_branches']}/{totals['num_branches']})")
          if pct < 80:
              sys.exit("::error::node branch coverage below 80 % (SPEC REQ-60)")
          PY

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # a whole-run timeout fails the job; it never counts as a pass
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv sync --frozen
      - name: Mutation score >= 75 % on the changed files
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="${PR_BASE:-$PUSH_BEFORE}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD^1)"
          fi
          uv run --frozen python -I tools/ci/mutation.py --base "$base"

  contract-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run --frozen python -I tools/ci/contract_lint.py

  ip-literals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -I tools/ci/ip_literals.py

  pr-size:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -I tools/ci/pr_size.py --base "$BASE_SHA" --head "$HEAD_SHA"

  ci:
    if: always()
    needs: [lint, test, ppe, td-test-ids, coverage, mutation, contract-lint, ip-literals, pr-size]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every CI job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 -I - <<'PY'
          import json, os, sys
          results = {job: v["result"] for job, v in json.loads(os.environ["NEEDS"]).items()}
          ok = True
          for job, result in sorted(results.items()):
              allowed = {"success"} | ({"skipped"} if job == "pr-size" and os.environ["EVENT"] == "push" else set())
              print(f"{job}: {result}")
              ok = ok and result in allowed
          if not ok:
              sys.exit("::error::a required CI job did not pass")
          PY
