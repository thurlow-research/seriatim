# DEMO ONLY, never merged (#10, answer 9(a)). Runs release.yml's build-job checks on crafted
# local tags, read-only. Nothing is pushed or published: the tags exist only on the runner.
# Expected: `control` passes; `malformed-tag`, `tag-not-on-main` and `version-mismatch` fail.
name: release-demo

on:
  pull_request:

permissions:
  contents: read

env:
  UV_VERSION: "0.11.19"
  UV_PYTHON: "3.12"

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: A tag on main's tip, matching __version__ (0.0.0), passes every check
        run: |
          sha="$(git rev-parse refs/remotes/origin/main)"
          git tag v0.0.0 "$sha"
          python3 -I tools/ci/release_checks.py tag --ref refs/tags/v0.0.0
          python3 -I tools/ci/release_checks.py source --ref refs/tags/v0.0.0 --sha "$sha" \
            --main-ref refs/remotes/origin/main --init node/seriatim_node/__init__.py
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv build --package seriatim-node --no-sources --out-dir "$RUNNER_TEMP/dist"
      - run: >-
          python3 -I tools/ci/release_checks.py dist --ref refs/tags/v0.0.0
          --sums "$RUNNER_TEMP/dist/SHA256SUMS" "$RUNNER_TEMP/dist"
          && cat "$RUNNER_TEMP/dist/SHA256SUMS"

  malformed-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: v0.0.1-beta.1 is neither vX.Y.Z nor vX.Y.Z-rc.N (expected to fail)
        run: python3 -I tools/ci/release_checks.py tag --ref refs/tags/v0.0.1-beta.1

  tag-not-on-main:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: v0.0.0 on this PR's merge commit, which main doesn't contain (expected to fail)
        run: |
          sha="$(git rev-parse HEAD)"
          git tag v0.0.0 "$sha"
          python3 -I tools/ci/release_checks.py source --ref refs/tags/v0.0.0 --sha "$sha" \
            --main-ref refs/remotes/origin/main --init node/seriatim_node/__init__.py

  version-mismatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: v0.0.1-rc.1 on main's tip while __version__ is 0.0.0 (expected to fail)
        run: |
          sha="$(git rev-parse refs/remotes/origin/main)"
          git tag v0.0.1-rc.1 "$sha"
          python3 -I tools/ci/release_checks.py source --ref refs/tags/v0.0.1-rc.1 --sha "$sha" \
            --main-ref refs/remotes/origin/main --init node/seriatim_node/__init__.py
